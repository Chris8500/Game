<!doctype html><html lang="de"><head><meta charset="utf-8"><base href="../"><title>Gegneranimation – Sichtprüfung</title><style>body{background:#28302d;color:#eee;font:14px system-ui;margin:20px}h2{margin:18px 0 8px}section{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}figure{margin:0;background:#39423d;border:1px solid #687366}canvas{display:block;width:100%;height:auto}figcaption{text-align:center;padding:4px}button{padding:8px;margin:0 8px 8px 0}#fixture{display:none}</style></head><body><h1>Gegner: Laufzyklus, Laufmündung und Sturz</h1><button id="right-preview">Blick rechts</button><button id="left-preview">Blick links</button><div id="gallery">Bilder laden …</div><div id="fixture"><canvas id="game" width="1536" height="1024"></canvas></div>
<script>window.requestAnimationFrame=()=>0;for(const id of ['overlay','pause','overlay-kicker','overlay-title','overlay-copy','start','restart','reload','sound','load-status','health','health-bar','wave','ammo','reload-status','score','message']){const el=document.createElement('button');el.id=id;document.getElementById('fixture').append(el);}</script>
<script src="src/enemy-hit-masks.js"></script><script src="src/engine.js"></script><script src="src/game.js"></script>
<script>
function preview(facing=1){const gallery=document.getElementById('gallery');gallery.replaceChildren();canvas.width=360;canvas.height=300;for(const mode of ['Laufen · rote Markierung = Projektilursprung','Sturz','Stand · rote Markierung = Projektilursprung']){const title=document.createElement('h2');title.textContent=mode;gallery.append(title);const section=document.createElement('section');gallery.append(section);for(let i=0;i<(mode.startsWith('Stand')?1:8);i++){const e={x:180,hp:2,attack:2,phase:i,facing,moving:mode.startsWith('Laufen'),hit:0};if(mode==='Sturz')e.fallTime=i*E.ENEMY_FALL_TIME/8+.001;ctx.clearRect(0,0,360,300);ctx.save();ctx.translate(0,-570);drawEnemy(e);const w=E.enemyPose(e);if(w.muzzleX!==undefined){ctx.strokeStyle='#ff6a62';ctx.lineWidth=1;ctx.beginPath();ctx.arc(w.muzzleX,w.muzzleY,4,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(w.muzzleX,w.muzzleY);ctx.lineTo(w.muzzleX+facing*22,w.muzzleY);ctx.stroke();}ctx.restore();const figure=document.createElement('figure'),copy=document.createElement('canvas'),caption=document.createElement('figcaption');copy.width=360;copy.height=300;copy.getContext('2d').drawImage(canvas,0,0);caption.textContent='Pose '+(i+1);figure.append(copy,caption);section.append(figure);}}}
document.getElementById('right-preview').onclick=()=>preview(1);document.getElementById('left-preview').onclick=()=>preview(-1);
function awaitArt(){if(ready)preview();else setTimeout(awaitArt,50);}awaitArt();
</script></body></html>
